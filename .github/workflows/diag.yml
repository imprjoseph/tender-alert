name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          B="https://web.pcc.gov.tw/prkms/tender/common/basic/readTenderBasic?pageSize=100&firstSearch=true&searchType=basic&isBinding=N&isLogIn=N&level_1=on&tenderType=TENDER_DECLARATION&tenderWay=TENDER_WAY_ALL_DECLARATION&dateType=isDate&tenderStartDate=2026%2F10%2F13&tenderEndDate=2026%2F10%2F15&radProctrgCate=RAD_PROCTRG_CATE_3"
          curl -sL -c cj -b cj -A "$UA" -o p1.html "$B"
          for p in 2 3 4 5 6 7 8 9 10; do sleep 4; curl -sL -c cj -b cj -A "$UA" -o p$p.html "$B&d-49738-p=$p&firstSearch=false"; done
          for f in p*.html; do echo "$f $(wc -c <$f) captcha=$(grep -c 驗證碼檢核 $f) rows=$(grep -o 'tpam?pk=' $f | wc -l)"; done > summary.txt
          git init -q && git checkout -q -b diag-out && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
