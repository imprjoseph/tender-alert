name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=$(dig +short A web.pcc.gov.tw | tr '\n' ' '); AAAA=$(dig +short AAAA web.pcc.gov.tw | tr '\n' ' ')
          echo "::notice title=dns::A=[$A] AAAA=[$AAAA]"
          r4=$(curl -4 -s -o /dev/null -m 25 -w '%{http_code} %{time_total}s' https://web.pcc.gov.tw/prkms/today/common/todayTender 2>&1 || true)
          r6=$(curl -6 -s -o /dev/null -m 15 -w '%{http_code}' https://web.pcc.gov.tw/ 2>&1 || true)
          echo "::notice title=curl::ipv4=[$r4] ipv6=[$r6]"
          o=$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://www.gov.tw/ || true)
          g=$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://www.google.com/ || true)
          echo "::notice title=other::gov.tw=[$o] google=[$g] myip=$(curl -s -m 10 https://api.ipify.org)"
          t=$(timeout 25 bash -c 'echo > /dev/tcp/'"$(dig +short A web.pcc.gov.tw | tail -1)"'/443' && echo open || echo closed)
          echo "::notice title=tcp443::$t"
