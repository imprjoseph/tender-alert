name: diag
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sL -A "$UA" -o today.html "https://web.pcc.gov.tw/prkms/today/common/todayTender"
          curl -sL -A "$UA" -o basic.html "https://web.pcc.gov.tw/prkms/tender/common/basic/readTenderBasic?pageSize=100&firstSearch=true&searchType=basic&isBinding=N&isLogIn=N&level_1=on&tenderName=%E8%AB%96%E5%A3%87&tenderType=TENDER_DECLARATION&tenderWay=TENDER_WAY_ALL_DECLARATION&dateType=isDate&tenderStartDate=2026%2F10%2F01&tenderEndDate=2026%2F10%2F15"
          curl -sL -A "$UA" -o detail.html "https://web.pcc.gov.tw/tps/QueryTender/query/searchTenderDetail?pkPmsMain=NzEzNTAyNDg"
          curl -sL -A "$UA" -o okfn.xml "https://web.pcc.gov.tw/tpsreport/transfer/dataTransfer.do?method=getOkfnOpenDataXml" || true
          ls -la > ls.txt
          git init -q && git checkout -q -b diag-out && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
