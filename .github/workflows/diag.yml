name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: [self-hosted, tender-tw]
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const run = (c) => { try { return execSync(c, {encoding:'utf8', timeout:60000, stdio:['ignore','pipe','pipe']}).trim().slice(0,400); } catch (e) { return 'ERR(' + e.status + '): ' + ((e.stderr||'') + (e.stdout||'') + e.message).replace(/\s+/g,' ').slice(0,400); } };
            core.notice(run('whoami'), {title:'whoami'});
            core.notice(run('where python & where git & where powershell & where pwsh'), {title:'where'});
            core.notice(run('powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Write-Output ps-ok; $PSVersionTable.PSVersion.ToString()"'), {title:'powershell'});
            core.notice(run('powershell -NoProfile -Command "Get-ExecutionPolicy -List | Out-String"'), {title:'execpolicy'});
            core.notice('TEMP=' + process.env.RUNNER_TEMP + ' PATH=' + (process.env.PATH||'').slice(0,600), {title:'env'});
            core.notice(run('python --version'), {title:'python'});
            core.notice(run('python -m pip --version'), {title:'pip'});
            core.notice(run('curl -s -o NUL -w "%{http_code} %{time_total}" https://web.pcc.gov.tw/prkms/today/common/todayTender'), {title:'pcc'});
            const fs = require('fs'); const f = require('path').join(process.env.RUNNER_TEMP, 't.ps1');
            fs.writeFileSync(f, 'Write-Output file-ok');
            core.notice(run('powershell -NoProfile -NonInteractive -ExecutionPolicy Unrestricted -Command ". \'' + f + '\'"'), {title:'ps1-file'});
