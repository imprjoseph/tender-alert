name: 每日標案快報

on:
  schedule:
    # 台灣時間 週一～週五 07:23（UTC 前一天 23:23）
    # GitHub 排程尖峰可能延遲 5–30 分鐘；避開整點較準時
    - cron: "23 23 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只預覽，不寄送（true/false）"
        default: "false"
      date:
        description: "指定日期 YYYYMMDD（留空 = 最近幾天）"
        default: ""

permissions:
  contents: write   # 需要把 data/seen.json、matches.csv、reports/ 存回 repo

concurrency:
  group: tender-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 執行標案掃描
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          python tender_alert.py $ARGS

      - name: 上傳 Email 預覽（dry-run 時）
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview.html

      - name: 存回紀錄
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "標案快報 $(TZ=Asia/Taipei date +%F)"
          git push
