name: 每日標案快報

on:
  schedule:
    # 每天 台灣時間 06:07（UTC 前一天 22:07）。GitHub 排程常延遲 1–2 小時，提早排確保上班前收到
    # 週末若無新案不寄信
    - cron: "7 22 * * *"
    # 補跑：台灣時間 09:37。若早上那次已成功就自動略過；失敗（例如採購網暫時連不上）則重跑
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只預覽，不寄送、不寫入（true/false）"
        default: "false"
      db_only:
        description: "只更新資料庫與 Excel，不寄信（true/false）"
        default: "false"
      rescore:
        description: "依目前 config.yml 重新標記資料庫並同步（改關鍵字後用，true/false）"
        default: "false"
      ignore_seen:
        description: "重寄所有仍在投標期限內的符合案件（true/false）"
        default: "false"
      sync_all:
        description: "把資料庫全部同步到雲端試算表（初次/重建用，true/false）"
        default: "false"
      days:
        description: "回補天數（搭配 db_only=true，逐日查詢；留空=依 config）"
        default: ""

permissions:
  contents: write   # 需要把 data/seen.json、matches.csv、reports/ 存回 repo

concurrency:
  group: tender-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 執行標案掃描
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.schedule }}" = "37 1 * * *" ]; then ARGS="--if-not-done"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.db_only }}" = "true" ]; then ARGS="$ARGS --db-only"; fi
          if [ "${{ github.event.inputs.ignore_seen }}" = "true" ]; then ARGS="$ARGS --ignore-seen"; fi
          if [ "${{ github.event.inputs.sync_all }}" = "true" ]; then ARGS="--sync-all"; fi
          if [ "${{ github.event.inputs.rescore }}" = "true" ]; then ARGS="--rescore"; fi
          if [ -n "${{ github.event.inputs.days }}" ]; then ARGS="$ARGS --days ${{ github.event.inputs.days }}"; fi
          python tender_alert.py $ARGS

      - name: 上傳 Email 預覽（dry-run 時）
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: preview
          path: preview.html

      - name: 存回紀錄
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "標案快報 $(TZ=Asia/Taipei date +%F)"
          git push
