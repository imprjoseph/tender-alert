name: 每日標案快報

on:
  schedule:
    # 每天 台灣時間 06:07（UTC 前一天 22:07）。GitHub 排程常延遲 1–2 小時，提早排確保上班前收到
    # 週末若無新案不寄信
    - cron: "7 22 * * *"
    # 補跑：台灣時間 09:37。若早上那次已成功就自動略過；失敗（例如採購網暫時連不上）則重跑
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只預覽，不寄送、不寫入（true/false）"
        default: "false"
      db_only:
        description: "只更新資料庫與 Excel，不寄信（true/false）"
        default: "false"
      rescore:
        description: "依目前 config.yml 重新標記資料庫並同步（改關鍵字後用，true/false）"
        default: "false"
      ignore_seen:
        description: "重寄所有仍在投標期限內的符合案件（true/false）"
        default: "false"
      sync_all:
        description: "把資料庫全部同步到雲端試算表（初次/重建用，true/false）"
        default: "false"
      days:
        description: "回補天數（搭配 db_only=true，逐日查詢；留空=依 config）"
        default: ""

permissions:
  contents: write   # 需要把 data/seen.json、matches.csv、reports/ 存回 repo

concurrency:
  group: tender-alert
  cancel-in-progress: false

jobs:
  run:
    # 採購網阻擋海外連線，須在台灣的電腦上執行（自架執行器）。
    # 若要改回 GitHub 雲端主機，把下一行改成：runs-on: ubuntu-latest
    runs-on: [self-hosted, tender-tw]
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      # Office PC: the service account cannot run setup-python's script (execution policy),
      # so install the official Python into the runner's tool folder once, then reuse it.
      - name: Setup Python (office PC)
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TOOL_CACHE "py312"
          $py = Join-Path $root "python.exe"
          if (-not (Test-Path $py)) {
            Write-Output "Installing Python 3.12 into $root"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $exe = Join-Path $env:RUNNER_TEMP "python-3.12.10-amd64.exe"
            Invoke-WebRequest "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe" -OutFile $exe -UseBasicParsing
            $p = Start-Process $exe -ArgumentList "/quiet","InstallAllUsers=0","TargetDir=$root","PrependPath=0","Include_test=0","Include_launcher=0","Include_doc=0","Shortcuts=0","AssociateFiles=0","Include_pip=1" -Wait -PassThru
            Write-Output "installer exit code: $($p.ExitCode)"
          }
          if (-not (Test-Path $py)) { Write-Output "::error title=python::install failed at $root"; exit 1 }
          & $py --version
          Add-Content -Path $env:GITHUB_PATH -Value $root
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $root "Scripts")

      - name: 安裝套件
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: 執行標案掃描
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IN_DB_ONLY: ${{ github.event.inputs.db_only }}
          IN_IGNORE_SEEN: ${{ github.event.inputs.ignore_seen }}
          IN_SYNC_ALL: ${{ github.event.inputs.sync_all }}
          IN_RESCORE: ${{ github.event.inputs.rescore }}
          IN_DAYS: ${{ github.event.inputs.days }}
        run: python ci.py run

      - name: 上傳 Email 預覽（dry-run 時）
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: preview
          path: preview.html

      - name: 存回紀錄
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python ci.py commit
