# =============================================================
#  標案快報 設定檔 — 改這個檔案就能調整關鍵字，不用動程式
#  在 GitHub 網頁上點檔案 → ✏️ 編輯 → Commit，下次排程就生效
#  比對規則：「包含」即命中（不分大小寫無差，中文直接比對）
# =============================================================

options:
  category: 勞務類          # 官方標案查詢的「採購性質」：勞務類 / 財物類 / 工程類 / 不限
  lookback_days: 3          # 查詢最近幾天的公告（含今天）；已通知過的不會重複
  budget_min: 0             # 預算下限（元），0 = 不限。例：500000
  budget_max: 0             # 預算上限（元），0 = 不限
  max_detail: 4             # 僅在查詢頁失敗、改用今日招標頁時使用：抓前 N 件明細補預算（勿調高，會觸發驗證碼）
  skip_expired: true        # 已過截止投標日的不通知
  send_when_empty: true     # 平日沒有新案也寄 Email（確認系統有在跑）；週末只在有新案時寄
  line_when_empty: false    # 沒有新案時不推 LINE（避免打擾）

filters:
  # ① 公告類型：只看「還能投」的公告
  type_include:
    - 招標公告              # 公開招標公告、選擇性招標公告…
    - 企劃書公告            # 公開取得報價單或企劃書公告（未達公告金額的評選案很多在這）
    - 公開評選              # 限制性招標(經公開評選或公開徵求)公告
    - 公開徵求              # 經公開評選或公開徵求之限制性招標
    - 選擇性招標
  type_exclude:
    - 決標                  # 決標公告、無法決標公告
    - 更正                  # 更正公告（若想追蹤截止日延期，可刪掉這行）

  # ② 採購性質再排除（主要由 options.category 在查詢時就過濾）
  category_exclude:
    - 工程類
    - 財物類

  # ③ 分類加分：案名已命中關鍵字、且標的分類屬下列者，排序往前
  category_boost:
    - 廣告服務              # 勞務類871
    - 娛樂、文化及運動服務    # 勞務類96
    - 市場研究及民意調查      # 勞務類864
  category_boost_score: 3

  # ④ 機關白名單／黑名單（留空 = 不限）
  unit_include: []          # 例：[經濟部, 數位發展部, 衛生福利部, 金融監督管理委員會]
  unit_exclude: []          # 例：[國防部陸軍司令部]

  # ⑤ 案名排除詞（全域）
  title_exclude:
    - 清潔
    - 清運
    - 保全
    - 駐衛
    - 保養
    - 維修
    - 修繕
    - 膳食
    - 伙食
    - 洗滌
    - 接送
    - 車輛租賃
    - 交通車
    - 遊覽車
    - 租車
    - 校外教學
    - 戶外教育
    - 畢業旅行
    - 露營
    - 游泳
    - 參訪
    - 整修
    - 油漆
    - 工程
    - 拆除
    - 路容
    - 器材
    - 設備
    - 宣導品
    - 托育
    - 托嬰
    - 保險
    - 責任險
    - 機票

# =============================================================
#  關鍵字群組：priority 越高，排序越前面
#  exclude：此群組專屬排除詞；must_also：同時必須包含其中一個
# =============================================================
keyword_groups:
  - name: 國際會議論壇
    priority: 5
    keywords: [國際會議, 國際論壇, 高峰會, 峰會, 論壇, 研討會, 年會, 博覽會, 國際交流]

  - name: 活動執行
    priority: 4
    keywords: [活動, 記者會, 說明會, 座談會, 工作坊, 典禮, 頒獎, 嘉年華, 成果展, 展覽, 策展, 大會, 競賽]
    exclude: [活動中心, 活動空間, 活動室, 教學活動]

  - name: 宣導行銷
    priority: 4
    keywords: [宣導, 行銷, 推廣, 公關, 媒體, 形象, 廣告, 影片, 短片, 社群, 文宣, 傳播, 溝通, 品牌]

  - name: 政策溝通
    priority: 3
    keywords: [政策溝通, 政策宣導, 輿情, 民意調查, 新聞稿, 媒體監測]

  # 範例：只要「AI」且同時提到「宣導/推廣」的案子
  # - name: AI 議題
  #   priority: 3
  #   keywords: [AI, 人工智慧]
  #   must_also: [宣導, 推廣, 論壇, 活動]
