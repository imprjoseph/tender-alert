# =============================================================
#  標案快報 設定檔 — 改這個檔案就能調整關鍵字，不用動程式
#  在 GitHub 網頁上點檔案 → ✏️ 編輯 → Commit，下次排程就生效
#  比對規則：「包含」即命中（不分大小寫無差，中文直接比對）
# =============================================================

options:
  category: 勞務類          # 官方標案查詢的「採購性質」：勞務類 / 財物類 / 工程類 / 不限
  lookback_days: 3          # 查詢最近幾天的公告（含今天）；已通知過的不會重複
  budget_min: 0             # 預算下限（元），0 = 不限。例：500000
  budget_max: 0             # 預算上限（元），0 = 不限
  max_detail: 4             # 僅在查詢頁失敗、改用今日招標頁時使用：抓前 N 件明細補預算（勿調高，會觸發驗證碼）
  skip_expired: true        # 已過截止投標日的不通知
  send_when_empty: true     # 平日沒有新案也寄 Email（確認系統有在跑）；週末只在有新案時寄
  line_when_empty: false    # 沒有新案時不推 LINE（避免打擾）
  extra_recipients:         # 除了 GitHub Secret MAIL_TO 之外，另外寄送的信箱
    - chengi.joseph@gmail.com
  attach_excel: true        # Email 附上「標案資料庫.xlsx」（累積全部資料）

filters:
  # ① 公告類型：只看「還能投」的公告
  type_include:
    - 招標公告              # 公開招標公告、選擇性招標公告…
    - 企劃書公告            # 公開取得報價單或企劃書公告（未達公告金額的評選案很多在這）
    - 公開評選              # 限制性招標(經公開評選或公開徵求)公告
    - 公開徵求              # 經公開評選或公開徵求之限制性招標
    - 選擇性招標
  type_exclude:
    - 決標                  # 決標公告、無法決標公告
    - 更正                  # 更正公告（若想追蹤截止日延期，可刪掉這行）

  # ② 採購性質再排除（主要由 options.category 在查詢時就過濾）
  category_exclude:
    - 工程類
    - 財物類

  # ③ 分類加分：案名已命中關鍵字、且標的分類屬下列者，排序往前
  category_boost:
    - 廣告服務              # 勞務類871
    - 娛樂、文化及運動服務    # 勞務類96
    - 市場研究及民意調查      # 勞務類864
  category_boost_score: 3

  # ④ 機關白名單／黑名單（留空 = 不限）
  unit_include: []          # 例：[經濟部, 數位發展部, 衛生福利部, 金融監督管理委員會]
  unit_exclude:             # 中小學、幼兒園的活動案多為校外教學、營隊，與本司業務無關
    - 國民小學
    - 國民中學
    - 國民中小學
    - 高級中學
    - 高級中等學校
    - 職業學校
    - 實驗小學
    - 實驗國民
    - 特殊教育學校
    - 啟聰學校
    - 啟明學校
    - 幼兒園

  # ⑤ 案名排除詞（全域）：含任一詞即排除
  title_exclude:
    # 非活動類勞務
    - 清潔
    - 清運
    - 保全
    - 駐衛
    - 保養
    - 維修
    - 維護
    - 修繕
    - 修補
    - 膳食
    - 伙食
    - 外燴
    - 餐會
    - 餐宴
    - 宴席
    - 晚宴
    - 洗滌
    - 物業
    - 保險
    - 責任險
    - 機票
    - 托育
    - 托嬰
    - 審核
    - 審查
    - 稽查
    - 巡檢
    - 盤查
    - 碳足跡
    - 職業訓練
    - 職前訓練
    - 會計
    - 工程
    - 拆除
    - 油漆
    - 整修
    - 路容
    - 器材
    - 設備
    - 宣導品
    - 印製
    - 結構
    # 交通、旅遊、校園
    - 接送
    - 車輛租賃
    - 交通車
    - 遊覽車
    - 租車
    - 校外
    - 戶外教育
    - 教學參觀
    - 畢業
    - 教育旅行
    - 遊學
    - 宿營
    - 營隊
    - 育樂營
    - 成長營
    - 體驗營
    - 露營
    - 游泳
    - 公民訓練
    - 公民教育
    # 內部聯誼、行政
    - 聯誼
    - 文康
    - 婚禮
    - 研習
    - 觀摩
    - 考察
    - 參訪
    - 歲末聯歡
    - 自強活動
    - 員工旅遊
    - 景觀
    - 綠美化
    - 工讀

# =============================================================
#  關鍵字（三層判斷）
#   strong：案名含任一即符合（本司核心業務用語）
#   weak  ：常見但太泛的字，需「同時」含 qualifiers 任一詞，
#           或案名含 2 個以上不同的 weak 詞，才算符合
#   weak_strict：更泛的字，只有在案名含 2 個以上不同 weak/weak_strict 詞時才算
#   priority 越高排序越前面；strong 命中分數 ×2
# =============================================================
qualifiers: [規劃, 規畫, 執行, 策劃, 企劃, 統籌, 委託專業服務, 委託服務, 委外服務]

keyword_groups:
  - name: 國際會議論壇
    priority: 5
    strong: [國際會議, 國際論壇, 國際研討會, 高峰會, 峰會, 論壇, 研討會, 博覽會, 年會暨, 學術年會, 會員大會, 國際交流會]
    weak: [大會]
    weak_strict: [國際交流]

  - name: 活動執行
    priority: 4
    strong: [記者會, 頒獎典禮, 開幕典禮, 啟動典禮, 開幕式, 嘉年華, 成果發表會, 成果展, 說明會, 座談會, 系列活動, 活動規劃, 活動執行, 主題活動, 節慶活動, 藝術節, 策展]
    weak: [活動, 典禮, 頒獎, 展覽, 晚會, 工作坊, 燈會]
    weak_strict: [競賽]
    exclude: [活動中心, 活動空間, 活動室, 活動橋, 教學活動, 生活動, 便當, 接駁]

  - name: 宣導行銷
    priority: 4
    strong: [整合行銷, 行銷宣傳, 行銷推廣, 城市行銷, 觀光行銷, 數位行銷, 網路行銷, 社群行銷, 媒體宣傳, 媒體行銷, 宣傳推廣, 宣導活動, 政令宣導, 公關, 整合傳播, 跨媒體, 廣告託播, 電視託播, 廣播廣告, 形象廣告, 影片製作, 影音製作, 宣傳影片, 宣導影片, 宣導短片, 微電影, 社群經營, 社群平台, 社群網站, 品牌識別, 品牌形象, 形象改造]
    weak: [宣導, 行銷, 宣傳, 廣告, 影片, 短片, 文宣]
    weak_strict: [推廣, 媒體, 社群, 傳播, 品牌, 形象]

  - name: 政策溝通
    priority: 3
    strong: [政策溝通, 政策宣導, 輿情, 民意調查, 滿意度調查, 新聞稿, 媒體監測, 社會溝通, 公眾溝通, 議題管理]
    weak_strict: [溝通]

  # 範例：只要「AI」且同時提到「宣導/推廣/論壇」的案子
  # - name: AI 議題
  #   priority: 3
  #   strong: []
  #   weak: [AI, 人工智慧]
